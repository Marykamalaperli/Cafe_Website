services:
  bitesbro:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      DATABASE_PATH: /app/data/bitesbro.sqlite
      CAFE_TIMEZONE: Asia/Kolkata
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-30}"
    volumes:
      - bitesbro-data:/app/data

volumes:
  bitesbro-data:
