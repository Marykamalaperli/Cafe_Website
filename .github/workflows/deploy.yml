
name: Deploy BitesBro Food Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci

      - name: Check code and isolated tests
        run: npm run check && npm test

      - name: Audit mobile and desktop quality
        run: npm run audit:quality
        env:
          CHROME_PATH: /usr/bin/google-chrome
          QUALITY_RUNS: '3'

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: quality-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Check accessibility and responsive customer flows
        run: npm run test:browser -- tests/accessibility.spec.js tests/browser.spec.js tests/customer-flow.spec.js tests/staff-delivery.spec.js tests/admin-queue.spec.js tests/payments.spec.js --reporter=list,github
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Keep browser failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare food menu frontend
        run: npm run build:pages
        env:
          PAGES_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          REQUIRE_SUPABASE: 'true'
          APP_PAYMENTS_ENABLED: ${{ vars.APP_PAYMENTS_ENABLED || 'false' }}
      - name: Build isolated YouPI payment review
        run: npm run build:review
        env:
          REVIEW_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/review/
      - name: Include the payment demo under review
        run: node --input-type=module -e "import {cpSync} from 'node:fs'; cpSync('_payment_review_site','_site/review',{recursive:true});"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for uploaded artifact metadata
        run: node scripts/wait-pages-artifact.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
