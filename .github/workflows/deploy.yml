
name: Deploy Cafe Website Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static frontend
        run: |
          mkdir -p _site
          cp -R public/. _site/
          touch _site/.nojekyll

          sed -i 's|/assets/|/Cafe_Website/assets/|g' _site/index.html _site/styles.css _site/app.js

          sed -i 's|"/styles.css|"/Cafe_Website/styles.css|g; s|"/app.js|"/Cafe_Website/app.js|g' _site/index.html

          sed -i 's|{{SITE_URL}}|https://marykamalaperli.github.io/Cafe_Website|g' _site/index.html _site/robots.txt _site/sitemap.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
